server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # Always revalidate so a deploy shows up at once (Cloudflare won't hold old JS).
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://ddragon.leagueoflegends.com; style-src 'self'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location = /health { default_type text/plain; return 200 "ok\n"; }
  location ~ ^/v/[^/]+/(.*)$ { try_files /$1 =404; }
  location / { try_files $uri $uri/ =404; }
}
