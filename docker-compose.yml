# See docs/hosting.md. Reuses Scrap Riot's Cloudflare Tunnel by joining its Docker network.
services:
  riftdaily:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - tunnel
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 32

networks:
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:-scrap-riot_default}
